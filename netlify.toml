[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"
  AI_GENERATE_IMAGES = "true"
  NETLIFY = "true"

# 函数配置
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."___netlify-server-handler"]
  timeout = 60
